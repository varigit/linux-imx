%YAML 1.2
---
$id: http://devicetree.org/schemas/leds/backlight/maxim,ds1050z.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Maxim DS1050Z Backlight

maintainers:
  - Natalia Kovalenko <natasha.k@variscite.com>

description: |
  The DS1050 is a programmable 5-bit pulse-width modulator
  with an addressable 2-wire (I2C) control interface.

properties:
  compatible:
    const: maxim,ds1050z

  reg:
    maxItems: 1
    description: I2C address of the device.

  default-brightness:
    description: |
      Default brightness to apply at startup.
      Valid range: from 0 to 32.
    $ref: /schemas/types.yaml#/definitions/uint32

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        backlight: backlight@2c {
            compatible = "maxim,ds1050z";
            reg = <0x2c>;
            default-brightness = <22>;
            status = "okay";
        };
    };
