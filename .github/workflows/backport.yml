name: Backport labeled merged pull requests

on:
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      source_pr_number:
        description: "PR number to backport"
        required: true
        type: string
      target_branches:
        description: "Space-delimited target branches"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  backport:
    name: Create backport PRs
    runs-on: ubuntu-latest
    # Run on merge, or via manual dispatch.
    if: >
      (github.event_name == 'pull_request_target' && github.event.pull_request.merged) ||
      (github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v4
      - name: Create backport PRs
        uses: korthout/backport-action@v4
        with:
          branch_name: dev_backport-${pull_number}-to-${target_branch}
          source_pr_number: ${{ inputs.source_pr_number }}
          target_branches: ${{ inputs.target_branches }}
